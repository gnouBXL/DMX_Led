[env]
platform = espressif32@7.0.1
framework = arduino
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
lib_deps =
    fastled/FastLED @ ^3.7.0
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.1.0
    bblanchon/ArduinoJson @ ^7.0.0

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[env:esp32-s3-mini]
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DBOARD_TYPE=S3_MINI
    -DMAX_STRIPS=4

[env:esp32-c3-mini]
board = esp32-c3-devkitm-1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_TYPE=C3_MINI
    -DMAX_STRIPS=1

[env:esp32-c3-oled]
board = esp32-c3-devkitm-1
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_TYPE=C3_OLED
    -DMAX_STRIPS=1
    -DHAS_OLED=1
    -DOLED_WIDTH=72
    -DOLED_HEIGHT=40
    -DOLED_ADDR=0x3C
    -DOLED_SDA=5
    -DOLED_SCL=6

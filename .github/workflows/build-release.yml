name: Build & Release Firmware

on:
  push:
    branches: [ main, feature/new-esp-boards ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "VERSION=v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESP32 dependencies
        run: |
          pip install platformio
          cd firmware
          pio pkg install

      - name: Build ESP32-S3 firmware
        run: |
          cd firmware
          pio run -e esp32-s3-devkitc-1
          pio run -e esp32-s3-mini
          pio run -e esp32-c3-mini
          pio run -e esp32-c3-oled

      - name: Build ESP32-S3 filesystem
        run: |
          cd firmware
          pio run -e esp32-s3-devkitc-1 --target buildfs
          pio run -e esp32-s3-mini --target buildfs
          pio run -e esp32-c3-mini --target buildfs
          pio run -e esp32-c3-oled --target buildfs

      - name: Prepare release files
        run: |
          mkdir -p release
          cp firmware/.pio/build/esp32-s3-devkitc-1/firmware.bin release/firmware-esp32s3.bin
          cp firmware/.pio/build/esp32-s3-devkitc-1/littlefs.bin release/firmware-esp32s3-littlefs.bin
          cp firmware/.pio/build/esp32-s3-devkitc-1/bootloader.bin release/bootloader-esp32s3.bin
          cp firmware/.pio/build/esp32-s3-devkitc-1/partitions.bin release/partitions-esp32s3.bin
          cp firmware/.pio/build/esp32-s3-mini/firmware.bin release/firmware-s3-mini.bin
          cp firmware/.pio/build/esp32-s3-mini/littlefs.bin release/firmware-s3-mini-littlefs.bin
          cp firmware/.pio/build/esp32-s3-mini/bootloader.bin release/bootloader-s3-mini.bin
          cp firmware/.pio/build/esp32-s3-mini/partitions.bin release/partitions-s3-mini.bin
          cp firmware/.pio/build/esp32-c3-mini/firmware.bin release/firmware-c3-mini.bin
          cp firmware/.pio/build/esp32-c3-mini/littlefs.bin release/firmware-c3-mini-littlefs.bin
          cp firmware/.pio/build/esp32-c3-mini/bootloader.bin release/bootloader-c3-mini.bin
          cp firmware/.pio/build/esp32-c3-mini/partitions.bin release/partitions-c3-mini.bin
          cp firmware/.pio/build/esp32-c3-oled/firmware.bin release/firmware-c3-oled.bin
          cp firmware/.pio/build/esp32-c3-oled/littlefs.bin release/firmware-c3-oled-littlefs.bin
          cp firmware/.pio/build/esp32-c3-oled/bootloader.bin release/bootloader-c3-oled.bin
          cp firmware/.pio/build/esp32-c3-oled/partitions.bin release/partitions-c3-oled.bin
          VERSION=${{ steps.version.outputs.VERSION }}
          BASE_URL="https://github.com/gnouBXL/DMX_Led/releases/download/${VERSION}"
          cat > release/manifest.json << MANIFEST
          {
            "name": "LED Controller",
            "version": "${VERSION}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "board": "esp32-s3-devkitc-1",
                "name": "ESP32-S3 DevKitC-1 (4 bandes)",
                "parts": [
                  {"path": "${BASE_URL}/bootloader-esp32s3.bin", "offset": 0},
                  {"path": "${BASE_URL}/partitions-esp32s3.bin", "offset": 32768},
                  {"path": "${BASE_URL}/firmware-esp32s3.bin", "offset": 65536},
                  {"path": "${BASE_URL}/firmware-esp32s3-littlefs.bin", "offset": 6750208}
                ]
              },
              {
                "chipFamily": "ESP32-S3",
                "board": "esp32-s3-mini",
                "name": "ESP32-S3 Mini (4 bandes)",
                "parts": [
                  {"path": "${BASE_URL}/bootloader-s3-mini.bin", "offset": 0},
                  {"path": "${BASE_URL}/partitions-s3-mini.bin", "offset": 32768},
                  {"path": "${BASE_URL}/firmware-s3-mini.bin", "offset": 65536},
                  {"path": "${BASE_URL}/firmware-s3-mini-littlefs.bin", "offset": 6750208}
                ]
              },
              {
                "chipFamily": "ESP32-C3",
                "board": "esp32-c3-mini",
                "name": "ESP32-C3 Super Mini (1 bande)",
                "parts": [
                  {"path": "${BASE_URL}/bootloader-c3-mini.bin", "offset": 0},
                  {"path": "${BASE_URL}/partitions-c3-mini.bin", "offset": 32768},
                  {"path": "${BASE_URL}/firmware-c3-mini.bin", "offset": 65536},
                  {"path": "${BASE_URL}/firmware-c3-mini-littlefs.bin", "offset": 2686976}
                ]
              },
              {
                "chipFamily": "ESP32-C3",
                "board": "esp32-c3-oled",
                "name": "ESP32-C3 OLED 0.42 pouces (1 bande + ecran)",
                "parts": [
                  {"path": "${BASE_URL}/bootloader-c3-oled.bin", "offset": 0},
                  {"path": "${BASE_URL}/partitions-c3-oled.bin", "offset": 32768},
                  {"path": "${BASE_URL}/firmware-c3-oled.bin", "offset": 65536},
                  {"path": "${BASE_URL}/firmware-c3-oled-littlefs.bin", "offset": 2686976}
                ]
              }
            ]
          }
          MANIFEST

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release Firmware

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "VERSION=v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESP32 dependencies
        run: |
          pip install platformio
          cd firmware
          pio pkg install

      - name: Build ESP32-S3 firmware
        run: |
          cd firmware
          pio run -e esp32-s3-devkitc-1

      - name: Build ESP32-S3 filesystem
        run: |
          cd firmware
          pio run -e esp32-s3-devkitc-1 --target buildfs

      - name: Prepare release files
        run: |
          mkdir -p release
          cp firmware/.pio/build/esp32-s3-devkitc-1/firmware.bin release/firmware-esp32s3.bin
          cp firmware/.pio/build/esp32-s3-devkitc-1/littlefs.bin release/firmware-esp32s3-littlefs.bin
          cp firmware/.pio/build/esp32-s3-devkitc-1/bootloader.bin release/bootloader-esp32s3.bin
          cp firmware/.pio/build/esp32-s3-devkitc-1/partitions.bin release/partitions-esp32s3.bin
          cat > release/manifest.json << 'MANIFEST'
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "date": "$(date +'%Y-%m-%d')",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "board": "esp32-s3-devkitc-1",
                "parts": [
                  {"path": "bootloader-esp32s3.bin", "offset": "0x0"},
                  {"path": "partitions-esp32s3.bin", "offset": "0x8000"},
                  {"path": "firmware-esp32s3.bin", "offset": "0x10000"},
                  {"path": "firmware-esp32s3-littlefs.bin", "offset": "0x670000"}
                ]
              }
            ]
          }
          MANIFEST

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
